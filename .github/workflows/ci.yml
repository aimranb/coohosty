name: Quality checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cohosty
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cohosty
      AUTH_SECRET: ci-only-not-a-production-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RUN_DATABASE_TESTS: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cohosty
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Vercel production deployment
        run: node .github/wait-production.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Audit the live website
        run: node .github/maintenance-audit.cjs
        env:
          AUDIT_ORIGIN: https://coohosty.com
          AUDIT_OUTPUT: .github/maintenance-live.json
      - name: Verify live desktop and mobile flows
        run: npx playwright test --config .github/maintenance-playwright.config.cjs
        env:
          E2E_BASE_URL: https://coohosty.com
